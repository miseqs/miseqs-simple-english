name: check
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python evals/ste_lint.py --self-test
      - run: node --test src/hooks/simple-english-activate.test.js src/hooks/hook-launchers.test.js
      - run: python src/hooks/test_lint_hook.py
      - run: python evals/check_numbers.py
